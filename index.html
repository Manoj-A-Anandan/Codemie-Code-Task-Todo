<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Daylight — ToDo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Daylight home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>daylight</span>
        </a>
        <span class="today-label" id="today-label"></span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span class="eyebrow-dot"></span> A LITTLE MORE FOCUS</p>
        <h1 id="page-title">Make today <span>count.</span></h1>
        <p class="subtitle">A clear mind starts with a clear list.</p>
      </section>

      <section class="todo-card" aria-label="ToDo list">
        <form class="add-form" id="add-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <span class="input-plus" aria-hidden="true">+</span>
          <input id="task-input" name="task" type="text" maxlength="160" placeholder="What needs to get done?" autocomplete="off" required />
          <label class="sr-only" for="due-date-input">Due date (optional)</label>
          <input id="due-date-input" name="dueDate" type="date" placeholder="Due date" autocomplete="off" />
          <button class="add-button" type="submit">Add task <span aria-hidden="true">↗</span></button>
        </form>

        <div class="list-toolbar">
          <p class="list-heading">YOUR TASKS <span id="task-total">0</span></p>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
        </div>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>

        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">✦</span>
          <p class="empty-title">Nothing on your list</p>
          <p class="empty-copy">Add a task above and make a little progress.</p>
        </div>

        <footer class="list-footer">
          <p id="remaining-count">You’re all caught up ✨</p>
          <button id="clear-completed" class="clear-button" type="button" hidden>Clear completed</button>
        </footer>
      </section>

      <p class="page-note">One thing at a time. You’ve got this.</p>
    </main>
  </body>
</html>
